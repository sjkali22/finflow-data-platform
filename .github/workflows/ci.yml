name: FinFlow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python-and-dbt-checks:
    name: Python and dbt checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall ingestion

      - name: Create dbt profiles directory
        run: |
          mkdir -p ~/.dbt

      - name: Create temporary dbt profile
        run: |
          cat > ~/.dbt/profiles.yml << 'EOF'
          finflow_dbt:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                user: finflow_user
                password: finflow_password
                port: 5432
                dbname: finflow
                schema: analytics
                threads: 4
          EOF

      - name: Check dbt project parse
        working-directory: dbt/finflow_dbt
        run: |
          dbt parse --no-version-check
